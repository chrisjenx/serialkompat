site_name: serialkompat
site_description: A backward/forward compatibility gate for kotlinx-serialization @Serializable models
site_url: https://chrisjenx.github.io/serialkompat/
repo_url: https://github.com/chrisjenx/serialkompat
repo_name: chrisjenx/serialkompat
edit_uri: edit/main/docs/

# Engineering specs stay on GitHub, not in the site.
exclude_docs: |
  design/
  superpowers/

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: Fira Code
  palette:
    # System preference first, then explicit light / dark (Metro's pattern).
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: green
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight

plugins:
  - search
  - macros:
      # Re-emit unknown {{ ... }} verbatim instead of failing. The CHANGELOG include
      # contains literal GitHub-Actions `${{ ... }}` expressions; pinning this keeps a
      # future plugin-default change from silently switching to strict and breaking the build.
      on_undefined: keep
  - llmstxt:
      markdown_description: >-
        A CI gate for kotlinx-serialization @Serializable models, like buf breaking but for
        JSON and CBOR: it diffs the wire schema against a git-ref baseline and fails CI on
        incompatible changes.
      full_output: llms-full.txt
      sections:
        Get started:
          - index.md: "Overview, the one-minute story and a worked diff-to-verdict example."
          - quickstart.md: "Add the plugin, merge the first PR, run serialkompatCheck and read the report."
          - installation.md: "Add serialkompat as a Gradle plugin, GitHub Action or standalone CLI."
          - concepts.md: "The baseline, backward versus forward compatibility, BREAK versus WARN, and a glossary."
        Guides:
          - ci.md: "Fail CI on a break with the GitHub Action or any CI that honours an exit code."
          - got-a-break.md: "Decision path for a reported break: fix it, accept it, rename it, or bump the major version."
          - adopting.md: "Adopt serialkompat in an existing codebase with discovery modes and annotations."
          - monorepos.md: "Scope each module's check to the wire types it owns."
          - history.md: "Check the current schema against every released version, for persisted data."
          - cbor.md: "Check kotlinx-serialization-cbor models with the same rules and gate as JSON."
          - cross-repo.md: "Diff snapshots from different repositories with the standalone CLI."
        Reference:
          - configuration.md: "Every option in the serialkompat { } block, with defaults."
          - tasks-cli.md: "Every Gradle task, the standalone CLI and its flags, and the exit codes."
          - rules.md: "Every classification rule, its severity per direction, and its round-trip proof."
          - report-formats.md: "Console, JSON, SARIF and GitHub annotation output, with byte-exact examples."
          - limitations.md: "What serialkompat cannot analyse, what to do about coverage gaps, and known limits."
          - troubleshooting.md: "Common failures and questions as symptom, cause and fix."
        How it works:
          - architecture.md: "One run of serialkompatCheck from start to finish, and the component map."
          - oracle.md: "Why verdicts can be trusted: every rule is checked against real kotlinx-serialization."
          - baseline-caching.md: "How the baseline is rebuilt from a git ref and cached under Gradle's caches."
          - contributing.md: "How to build, test and contribute to serialkompat."

extra_css:
  - stylesheets/pipeline.css

extra_javascript:
  - javascripts/mermaid.min.js
  - javascripts/mermaid-init.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid-diagram
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      check_paths: true
      base_path: ["."]

not_in_nav: |
  setup.md
  recipes.md
  deep-dive.md

nav:
  - Home: index.md
  - Get started:
      - Quick start: quickstart.md
      - Installation: installation.md
      - Concepts: concepts.md
  - Guides:
      - CI: ci.md
      - Got a BREAK?: got-a-break.md
      - Adopting gradually: adopting.md
      - Monorepos: monorepos.md
      - Persisted data & history: history.md
      - CBOR: cbor.md
      - Cross-repo with the CLI: cross-repo.md
  - Reference:
      - Configuration: configuration.md
      - Tasks & CLI: tasks-cli.md
      - Rules: rules.md
      - Report formats: report-formats.md
      - Limitations: limitations.md
      - Troubleshooting & FAQ: troubleshooting.md
  - How it works:
      - Architecture: architecture.md
      - The oracle: oracle.md
      - Baseline & caching: baseline-caching.md
      - Contributing: contributing.md
      - Changelog: changelog.md
      - API: https://chrisjenx.github.io/serialkompat/api/
