site_name: serialkompat
site_description: A backward/forward compatibility gate for kotlinx-serialization @Serializable models
site_url: https://chrisjenx.github.io/serialkompat/
repo_url: https://github.com/chrisjenx/serialkompat
repo_name: chrisjenx/serialkompat
edit_uri: edit/main/docs/

# Engineering specs stay on GitHub, not in the site.
exclude_docs: |
  design/
  superpowers/

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: Fira Code
  palette:
    # System preference first, then explicit light / dark (Metro's pattern).
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: green
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight

plugins:
  - search
  - macros:
      # Re-emit unknown {{ ... }} verbatim instead of failing. The CHANGELOG include
      # contains literal GitHub-Actions `${{ ... }}` expressions; pinning this keeps a
      # future plugin-default change from silently switching to strict and breaking the build.
      on_undefined: keep

extra_css:
  - stylesheets/pipeline.css

extra_javascript:
  - javascripts/mermaid.min.js
  - javascripts/mermaid-init.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid-diagram
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      check_paths: true
      base_path: ["."]

not_in_nav: |
  setup.md
  recipes.md
  deep-dive.md

nav:
  - Home: index.md
  - Get started:
      - Quick start: quickstart.md
      - Installation: installation.md
      - Concepts: concepts.md
  - Guides:
      - CI: ci.md
      - Got a BREAK?: got-a-break.md
      - Adopting gradually: adopting.md
      - Monorepos: monorepos.md
      - Persisted data & history: history.md
      - CBOR: cbor.md
      - Cross-repo with the CLI: cross-repo.md
  - Reference:
      - Configuration: configuration.md
      - Tasks & CLI: tasks-cli.md
      - Rules: rules.md
      - Report formats: report-formats.md
      - Limitations: limitations.md
      - Troubleshooting & FAQ: troubleshooting.md
  - How it works:
      - Architecture: architecture.md
      - The oracle: oracle.md
      - Baseline & caching: baseline-caching.md
      - Contributing: contributing.md
      - Changelog: changelog.md
      - API: https://chrisjenx.github.io/serialkompat/api/
